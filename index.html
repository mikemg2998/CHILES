<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pollo a la brasa</title>
<meta name="theme-color" content="#1c0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pollo a la brasa">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app/styles.css">
</head>
<body data-int="0">
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="icon-192.png" alt="" width="40" height="40"><h1>Pollo <em>a la</em> brasa</h1></div>
    <button class="icon-btn" id="btnFav" aria-label="Favoritas">♥</button>
    <button class="icon-btn" id="btnSettings" aria-label="Ajustes">⚙</button>
  </header>

  <div class="modes" id="modes" role="tablist"></div>

  <div class="turn" id="turn"></div>

  <section class="dice" id="dice"></section>

  <section class="result" id="result">
    <p class="intro">Cuatro dados: <b>acción</b>, <b>zona</b>, <b>forma</b> y <b>condición</b>. Cada tirada se convierte en una instrucción que tiene sentido. Las rondas suben y bajan de intensidad solas.</p>
  </section>

  <div class="actions">
    <button class="btn primary" id="btnRoll">Lanzar dados</button>
    <div class="row" id="secondary" hidden>
      <button class="btn ghost" id="btnPass">Pasar</button>
      <button class="btn ghost" id="btnReroll">Volver a lanzar</button>
      <button class="btn ghost" id="btnLower">Bajar intensidad</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheetSettings" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2>Ajustes</h2><button class="icon-btn" data-close>✕</button></div>
    <label class="field">Nombre 1<input id="name0" maxlength="18" placeholder="Jugador 1"></label>
    <label class="field">Nombre 2<input id="name1" maxlength="18" placeholder="Jugador 2"></label>
    <h3>Zonas del cuerpo</h3>
    <div class="checks" id="groups"></div>
    <h3>Intensidad máxima</h3>
    <div class="range"><input type="range" id="maxInt" min="1" max="5" step="1"><span id="maxIntLabel"></span></div>
    <h3>Duración de las rondas</h3>
    <div class="seg" id="duration"><button data-v="corto">Cortas</button><button data-v="normal">Normales</button><button data-v="largo">Largas</button></div>
    <button class="btn ghost" id="btnReset">Empezar partida nueva</button>
  </div>
</div>

<div class="sheet" id="sheetFav" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2>Favoritas</h2><button class="icon-btn" data-close>✕</button></div>
    <div id="favList"></div>
  </div>
</div>

<script type="module" src="app/app.js"></script>
</body>
</html>
